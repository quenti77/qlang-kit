name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qlang
        run: |
          curl -fsSL https://raw.githubusercontent.com/quenti77/qlang/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: qlang --version
      - run: qlang test --allow-process
      - name: The code is laid out (qlang fmt)
        run: qlang fmt --check
      - name: No unused code, and no function more tangled than today's worst (qlang lint)
        run: qlang lint --max-complexity 40
      - name: Every file says its stability level
        run: qlang doc --require-levels -o /dev/null
      - name: The built-in stubs are embedded
        run: |
          python3 scripts/embed_stubs.py
          qlang fmt make/builtin.q
          git diff --exit-code make/builtin.q
      - name: What `kit make` writes is in order (fmt, check, tests)
        run: scripts/check_generated.sh
      - name: The installer and the launcher
        run: scripts/test_install.sh
