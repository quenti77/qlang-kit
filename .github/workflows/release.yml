name: Release

# A tag `vX.Y.Z` tests everything, builds the archive that `install.sh` downloads, and publishes it with its checksum
# and a signed build provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install qlang
        run: |
          curl -fsSL https://raw.githubusercontent.com/quenti77/qlang/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The tag, qlang.toml and version.q agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toml=$(sed -n 's/^version = "\(.*\)"/\1/p' qlang.toml | head -1)
          code=$(sed -n 's/.*"\([0-9][0-9.]*\)".*/\1/p' version.q | head -1)
          echo "tag $tag, qlang.toml $toml, version.q $code"
          [ "$tag" = "$toml" ] && [ "$tag" = "$code" ]
      - run: qlang test --allow-process
      - run: qlang fmt --check
      - name: The built-in stubs are embedded
        run: |
          python3 scripts/embed_stubs.py
          qlang fmt make/builtin.q
          git diff --exit-code make/builtin.q
      - run: scripts/check_generated.sh
      - run: scripts/test_install.sh
      - name: Build the archive
        run: scripts/package.sh "${GITHUB_REF_NAME#v}" dist
      - name: Sign the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kit ${GITHUB_REF_NAME#v}" \
            --generate-notes
